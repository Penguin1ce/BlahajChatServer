[server]
port = 8080
env  = "development"

[database]
host     = "127.0.0.1"
port     = 3306
user     = "root"
password = "secret"
name     = "blahaj"
# 连接池参数，留空/为 0 时用默认值（max_open=50, max_idle=10, lifetime=30min）
max_open_conns            = 50
max_idle_conns            = 10
conn_max_lifetime_minutes = 30

[redis]
host     = "127.0.0.1"
port     = 6379
password = ""
db       = 0

[jwt]
secret              = "change-me-to-a-long-random-string"
access_ttl_minutes  = 15
refresh_ttl_days    = 30

[log]
# level: debug / info / warn / error / fatal
level  = "info"
# format: console (彩色，开发用) / json (生产用)
format = "console"
# file: 留空则只输出到 stdout，否则同时写入该文件 (JSON 格式)
file   = ""

[kafka]
# 容器内用 "kafka:9092"，本地开发用 "127.0.0.1:9094"
brokers  = ["127.0.0.1:9094"]
topic    = "chat.events"
# 留空时自动用 "blahaj-ws-${HOSTNAME}"，每实例独立 group
group_id = ""
